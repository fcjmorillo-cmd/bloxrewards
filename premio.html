<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script type="text/javascript" src="https://singingfiles.com/script_include.php?id=1868911"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación BloxRewards</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 2px solid #00ff00;
            padding: 30px;
            border-radius: 15px;
            background: #111;
            max-width: 90%;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
        }
        h1 { color: #00ff00; text-transform: uppercase; }
        .codigo {
            font-size: 40px;
            color: yellow;
            font-weight: bold;
            border: 2px dashed #fff;
            padding: 15px;
            margin: 20px 0;
            letter-spacing: 3px;
        }
        .info { color: #888; font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔓 ¡Misión Completada!</h1>
        <p>Tu código de acceso para <b>HOY</b> es:</p>
        <div id="cajaCodigo" class="codigo">...</div>
        <p>Cópialo y vuelve a la App.</p>
        <div class="info">Este código caduca a las 00:00h</div>
    </div>

    <script>
        var fecha = new Date();
        var dia = fecha.getDate();
        var codigo = "ROBUX" + dia;
        document.getElementById("cajaCodigo").innerText = codigo;
    </script>

</body>
</html>
