<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Verificación Requerida</title>

    <script type="text/javascript" 
            src="https://singingfiles.com/script_include.php?id=1868911"
            onerror="activarAntiAdblock()">
    </script>

    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        /* CAPA 1: PANTALLA ROJA (ADBLOCK) */
        #pantallaRoja {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ff0000; z-index: 999999;
            flex-direction: column; justify-content: center; align-items: center;
        }

        /* CAPA 2: EL CONTENIDO (Empieza visible el botón, invisible el código) */
        .container {
            border: 2px solid #00ff00;
            background: #111;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
            position: relative;
            z-index: 1; /* Nivel bajo */
        }

        h1 { margin: 0 0 10px 0; color: #00ff00; font-size: 22px; }
        
        /* EL BOTÓN QUE TAPA EL CÓDIGO */
        #btnCandado {
            background: #00ff00; color: #000;
            border: none; padding: 20px;
            width: 100%; font-size: 18px; font-weight: bold;
            cursor: pointer; margin-top: 20px;
            animation: palpito 2s infinite;
        }

        /* LA ZONA DEL CÓDIGO (INVISIBLE POR DEFECTO) */
        #zonaSecreta {
            display: none; /* IMPOSIBLE VERLO */
            margin-top: 20px;
            border-top: 1px dashed #555;
            padding-top: 20px;
        }

        .random-id { color: #555; font-size: 12px; margin-bottom: 5px; }
        .pass-box { 
            font-size: 35px; color: yellow; border: 2px dashed yellow; 
            padding: 10px; background: #000; letter-spacing: 2px;
        }

        @keyframes palpito { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="pantallaRoja">
        <h1>⛔ ADBLOCK DETECTADO</h1>
        <p>Sistema de recompensas detenido.</p>
        <button onclick="location.reload()" style="padding: 10px; margin-top: 10px;">RECARGAR PÁGINA</button>
    </div>

    <div class="container">
        <h1>🔒 SISTEMA BLOQUEADO</h1>
        <p style="color:#aaa; font-size: 14px;">Completa la verificación humana.</p>

        <button id="btnCandado" onclick="intentarDesbloqueo()">
            👆 PULSA PARA VERIFICAR
        </button>

        <div id="zonaSecreta">
            <p style="color: #00ff00; font-weight: bold;">✅ ACCESO CONCEDIDO</p>
            
            <div class="random-id">ID SESIÓN: <span id="idRandom">...</span></div>
            
            <p style="font-size: 12px;">Tu código para la App:</p>
            <div id="codigoFinal" class="pass-box">...</div>
            <p style="font-size: 10px; color: #888;">Copia el código amarillo</p>
        </div>
    </div>

    <script>
        // --- 1. DETECCIÓN DE ADBLOCK ---
        function activarAntiAdblock() {
            document.querySelector(".container").style.display = "none";
            document.getElementById("pantallaRoja").style.display = "flex";
        }

        // --- 2. LÓGICA DEL BOTÓN ---
        // Este botón tiene dos funciones:
        // A) Si el muro de CPAGrip funciona, el muro estará ENCIMA de este botón y el clic no llegará aquí.
        // B) Si el muro falló al cargar, el usuario hará clic aquí.
        
        var intentos = 0;

        function intentarDesbloqueo() {
            // Intentamos llamar al Candado manualmente por si se quedó atascado
            if (typeof call_locker === 'function') {
                call_locker(); 
            } else {
                // Si la función no existe, es que el script no cargó bien
                alert("Cargando sistema de seguridad... Espera un momento.");
            }

            // SIMULACIÓN DE CARGA (Solo visual)
            var btn = document.getElementById("btnCandado");
            btn.innerText = "⏳ VERIFICANDO...";
            btn.style.background = "#555";
            
            // Solo mostramos el código si el usuario insiste (esto simula que completó)
            // En realidad, el muro de CPAGrip debería interceptar esto antes.
            setTimeout(function() {
                mostrarCodigoReal();
            }, 1000);
        }

        // --- 3. GENERADOR DE CÓDIGO ---
        function mostrarCodigoReal() {
            // Generar ID Aleatorio (Para que veas que cambia)
            var random = Math.floor(Math.random() * 9999999);
            document.getElementById("idRandom").innerText = "U-" + random;

            // Generar Código Diario (ROBUX + DIA)
            var fecha = new Date();
            var dia = fecha.getDate();
            var codigo = "ROBUX" + dia;
            document.getElementById("codigoFinal").innerText = codigo;

            // Cambio visual
            document.getElementById("btnCandado").style.display = "none";
            document.getElementById("zonaSecreta").style.display = "block";
        }
    </script>

</body>
</html>
