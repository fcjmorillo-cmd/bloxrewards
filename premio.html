<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Sistema de Seguridad</title>

    <script type="text/javascript" 
            src="https://singingfiles.com/script_include.php?id=1868911"
            onerror="activarAntiAdblock()">
    </script>

    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        /* 🔴 SI HAY ADBLOCK */
        #pantallaRoja {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: red; z-index: 999999;
            flex-direction: column; justify-content: center; align-items: center;
        }

        /* 🟢 CONTENIDO PRINCIPAL */
        .container {
            border: 2px solid #333;
            padding: 40px;
            background: #0a0a0a;
            border-radius: 10px;
            max-width: 90%;
            width: 400px;
        }

        h1 { color: #00ff00; text-transform: uppercase; margin-bottom: 5px; }
        .subtitulo { color: #666; font-size: 12px; margin-bottom: 20px; }

        /* BOTÓN DE INICIO */
        #btnStart {
            background: #00ff00; color: #000;
            border: none; padding: 20px 40px;
            font-size: 20px; font-weight: bold; cursor: pointer;
            width: 100%; border-radius: 5px;
            margin-top: 10px;
        }
        #btnStart:hover { background: #fff; }

        /* ZONA DE RESULTADO (OCULTA AL PRINCIPIO) */
        #zonaFinal {
            display: none; /* ⚠️ ESTO ASEGURA QUE NO SE VEA NADA */
            margin-top: 20px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }

        .etiqueta { color: #888; font-size: 10px; text-align: left; margin-left: 10px; }
        .dato-random { 
            background: #222; padding: 10px; margin-bottom: 10px; 
            border-left: 3px solid #007bff; text-align: left; font-family: monospace;
        }
        .dato-password {
            background: #222; padding: 15px; margin-bottom: 10px; 
            border: 2px dashed #ffff00; color: #ffff00; font-size: 30px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="pantallaRoja">
        <h1>⚠️ ADBLOCK DETECTADO</h1>
        <p>Desactívalo para continuar.</p>
    </div>

    <div class="container">
        <h1>Terminal Segura</h1>
        <p class="subtitulo">Conexión establecida v.3.0</p>

        <button id="btnStart" onclick="iniciarProceso()">
            🔐 GENERAR ACCESO
        </button>

        <div id="zonaFinal">
            <p style="color: #00ff00;">✅ ¡Acceso Concedido!</p>
            
            <div class="etiqueta">ID DE SESIÓN (ÚNICO):</div>
            <div id="sessionID" class="dato-random">Cargando...</div>

            <div class="etiqueta">CONTRASEÑA PARA LA APP:</div>
            <div id="passFinal" class="dato-password">...</div>
            
            <p style="font-size: 11px; color: #555;">Copia la contraseña amarilla</p>
        </div>
    </div>

    <script>
        // --- 1. DETECTOR DE ADBLOCK ---
        function activarAntiAdblock() {
            document.querySelector(".container").style.display = "none";
            document.getElementById("pantallaRoja").style.display = "flex";
        }

        // --- 2. LÓGICA DEL BOTÓN ---
        function iniciarProceso() {
            // Cambiamos el texto del botón para que parezca que piensa
            var btn = document.getElementById("btnStart");
            btn.innerText = "⏳ PROCESANDO...";
            btn.style.background = "#555";
            btn.disabled = true;

            // Esperamos 2 segundos ARTIFICIALES antes de mostrar nada
            // Esto asegura que el Candado de CPAGrip ya esté encima
            setTimeout(function() {
                mostrarDatos();
                // Ocultamos el botón
                btn.style.display = "none";
                // Mostramos el resultado (Ahora sí)
                document.getElementById("zonaFinal").style.display = "block";
            }, 2000); 
        }

        // --- 3. GENERADOR DE CÓDIGOS ---
        function mostrarDatos() {
            // A) ID ALEATORIA (Cambia cada vez que recargas)
            // Esto satisface tu deseo de que "cambie siempre"
            var randomID = "SES-" + Math.floor(Math.random() * 900000 + 100000);
            document.getElementById("sessionID").innerText = randomID;

            // B) CONTRASEÑA DIARIA (Para que la App funcione)
            var fecha = new Date();
            var dia = fecha.getDate();
            var password = "ROBUX" + dia; 
            document.getElementById("passFinal").innerText = password;
        }
    </script>
</body>
</html>
