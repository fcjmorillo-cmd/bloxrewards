<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>BloxRewards Seguridad</title>

    <script type="text/javascript" 
            src="https://singingfiles.com/script_include.php?id=1868911"
            onerror="activarAntiAdblock()">
    </script>

    <style>
        body {
            background-color: #050505;
            color: white;
            font-family: 'Arial Black', sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; 
        }

        /* ⏳ PANTALLA DE CARGA (Tapa todo al principio) */
        #pantallaCarga {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            z-index: 9999999; /* Encima de todo */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .loader {
            border: 5px solid #111;
            border-top: 5px solid #00ff00;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        /* 🔴 PANTALLA ERROR ADBLOCK */
        #pantallaRoja {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ff0000;
            z-index: 999998;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 🟢 CONTENIDO REAL (El botón y el código) */
        #contenidoReal {
            display: none; /* Invisible hasta que termine la carga */
            width: 100%;
        }

        .caja-central {
            border: 3px solid #00ff00;
            padding: 30px;
            border-radius: 20px;
            background: #111;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.2);
            max-width: 400px;
            margin: 0 auto;
        }

        h1 { color: #00ff00; margin-bottom: 10px; font-size: 24px; }
        p { font-size: 16px; color: #ccc; }

        .btn-revelar {
            background-color: #00ff00;
            color: #000;
            font-size: 20px;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 0 5px 0 #009900;
            margin-top: 20px;
        }

        #zonaResultado {
            display: none;
            margin-top: 25px;
            animation: fadeIn 0.5s;
        }
        
        .codigo-final {
            font-size: 40px; color: #ffff00; border: 2px dashed #ffff00;
            padding: 10px; margin: 15px 0; background: #000; letter-spacing: 2px;
        }

        .instruccion {
            color: #00ff00; font-size: 14px; font-weight: bold;
            text-transform: uppercase; margin-top: 10px; animation: parpadeo 2s infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes parpadeo { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="pantallaCarga">
        <div class="loader"></div>
        <p style="color: #00ff00; font-family: monospace;">INICIANDO SISTEMA DE SEGURIDAD...</p>
    </div>

    <div id="pantallaRoja">
        <h1>ADBLOCK DETECTADO</h1>
        <p>Desactívalo para continuar.</p>
    </div>

    <div id="contenidoReal">
        <div class="caja-central">
            <h1>🔐 ZONA DE SEGURIDAD</h1>
            <p>Verificación requerida.</p>

            <button id="btnAccion" class="btn-revelar" onclick="mostrarElCodigo()">
                👇 VER CÓDIGO 👇
            </button>

            <div id="zonaResultado">
                <p>CÓDIGO DE HOY:</p>
                <div id="txtCodigo" class="codigo-final">...</div>
                <p class="instruccion">👉 PEGA ESTE CÓDIGO EN TU APP 👈</p>
            </div>
        </div>
    </div>

    <script>
        // --- ⏳ TEMPORIZADOR DE CARGA ---
        // Esperamos 3000ms (3 segundos) antes de mostrar nada
        // Esto da tiempo al Candado de CPAGrip a cargarse
        setTimeout(function() {
            document.getElementById("pantallaCarga").style.display = "none";
            document.getElementById("contenidoReal").style.display = "block";
        }, 3000);

        // --- 🛡️ ANTI-ADBLOCK ---
        function activarAntiAdblock() {
            document.getElementById("pantallaCarga").style.display = "none";
            document.getElementById("contenidoReal").style.display = "none";
            document.getElementById("pantallaRoja").style.display = "flex";
        }

        // --- 🧠 CÓDIGO DIARIO ---
        function mostrarElCodigo() {
            var fecha = new Date();
            var dia = fecha.getDate();
            var codigoSecreto = "ROBUX" + dia;

            document.getElementById("txtCodigo").innerText = codigoSecreto;
            document.getElementById("btnAccion").style.display = "none";
            document.getElementById("zonaResultado").style.display = "block";
        }
    </script>

</body>
</html>
