        body {

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            text-align: center;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            border: 2px solid #00ff88; /* Verde Neón */
            background: linear-gradient(145deg, #1a1a1a, #000000);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            max-width: 90%;
            width: 400px;
            position: relative;
        }

        h1 {
            color: #00ff88;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        p {
            color: #cccccc;
            font-size: 16px;
            line-height: 1.5;
        }

        /* LA CAJA DEL CÓDIGO */
        .code-box {
            background-color: #111;
            border: 2px dashed #ffe600; /* Amarillo */
            color: #ffe600;
            font-size: 42px;
            font-weight: 800;
            padding: 20px;
            margin: 25px 0;
            border-radius: 10px;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(255, 230, 0, 0.5);
            user-select: all; /* Facilita copiar */
        }

        .timer {
            font-size: 12px;
            color: #666;
            margin-top: 15px;
        }

        /* Animación de carga */
        .loading {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.5; }
        }
    </style>
